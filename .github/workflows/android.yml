name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      serverUrl:
        description: "Backend base URL to bake into the build"
        required: false
        default: "https://CHANGE-ME.example.com/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace -PserverUrl="${{ github.event.inputs.serverUrl || 'https://CHANGE-ME.example.com/' }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartcall-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
