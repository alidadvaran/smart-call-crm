name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      serverUrl:
        description: "Backend base URL to bake into the build"
        required: false
        default: "https://CHANGE-ME.example.com/"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a pre-installed Android SDK with cmdline-tools.
      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon \
            -PserverUrl="${{ github.event.inputs.serverUrl || 'https://CHANGE-ME.example.com/' }}" \
            2>&1 | tee build-output.log

      # On failure, post the extracted errors as a commit comment so they can
      # be read back through api.github.com.
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERR=$(grep -nE "^e: |error:|FAILURE:|What went wrong|FAILED$|Caused by:|Unresolved reference|Compilation error" build-output.log | head -120 || true)
          [ -z "$ERR" ] && ERR="$(tail -150 build-output.log)"
          jq -n --arg b "$(printf 'CI build failed — extracted errors:\n\n```\n%s\n```' "$ERR")" '{body:$b}' \
            | gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input -

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartcall-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
