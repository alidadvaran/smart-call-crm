# One-command backend: PostgreSQL + Node app + Caddy (automatic HTTPS).
# Usage (from this deploy/ folder):
#   cp .env.example .env && nano .env     # fill in DOMAIN, passwords, Gmail
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: smartcall
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: smartcall
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcall"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ../server
    restart: always
    environment:
      DATABASE_URL: postgres://smartcall:${DB_PASSWORD}@db:5432/smartcall
      PORT: "8080"
      TZ: ${TZ:-Asia/Tehran}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      REPORT_RECIPIENT: ${REPORT_RECIPIENT}
      ENABLE_DAILY_REPORT: ${ENABLE_DAILY_REPORT:-true}
      ENABLE_WEEKLY_REPORT: ${ENABLE_WEEKLY_REPORT:-true}
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASS: ${DASHBOARD_PASS}
      APK_DIR: /data/apk
      APP_UPLOAD_TOKEN: ${APP_UPLOAD_TOKEN}
      PUBLIC_BASE_URL: https://${DOMAIN}
    volumes:
      - apkdata:/data/apk
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  dbdata:
  caddydata:
  caddyconfig:
  apkdata:
